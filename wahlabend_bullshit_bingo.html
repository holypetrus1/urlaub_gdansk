<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wahlabend – Bullshit Bingo</title>
<style>
:root{--bg:#10141c;--panel:#181e29;--tile:#202838;--line:#344055;--text:#f5f7fb;--muted:#aab4c6;--green:#72e0b2;--gold:#f3c969}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:clamp(12px,2vw,28px);display:flex;justify-content:center}.app{width:100%;max-width:1400px;height:100%;display:flex;flex-direction:column;gap:clamp(10px,1.5vh,18px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:800}h1{font-size:clamp(22px,3vw,38px);line-height:1;margin:5px 0 0;font-weight:850;letter-spacing:-.045em}.controls{display:flex;gap:9px;flex-wrap:wrap}button{font:inherit;color:var(--text);border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--green);color:#10231b;border-color:var(--green)}.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,26px)}.player{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(12px,1.7vw,24px);display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px)}.player-top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.player-name{display:flex;align-items:center;gap:10px;font-size:clamp(16px,1.8vw,23px);font-weight:850}.dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #72e0b21a}.right .dot{background:var(--gold);box-shadow:0 0 0 5px #f3c9691a}.score,.hint,.stamp{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(6px,1vw,12px)}.tile{position:relative;min-width:0;min-height:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(8px,1.2vw,16px);border-radius:15px;background:var(--tile);border:1px solid #3a465a;overflow:hidden}.phrase{font-size:clamp(11px,1.25vw,17px);line-height:1.18;font-weight:780;letter-spacing:-.02em;overflow-wrap:anywhere}.mark{position:absolute;right:9px;top:7px;font-size:18px;opacity:0}.tile.selected{background:#72e0b222;border-color:var(--green);box-shadow:inset 0 0 0 1px #72e0b24d}.right .tile.selected{background:#f3c96922;border-color:var(--gold);box-shadow:inset 0 0 0 1px #f3c9694d}.tile.selected .mark{opacity:1}.tile.selected .stamp{color:var(--green)}.right .tile.selected .stamp{color:var(--gold)}.win{font-size:12px;font-weight:850;color:var(--green);opacity:0}.right .win{color:var(--gold)}.win.show{opacity:1}footer{text-align:center;color:var(--muted);font-size:11px}@media(orientation:portrait){body{overflow:auto;height:auto;min-height:100%}.app{height:auto}.layout{grid-template-columns:1fr}.player{min-height:420px}.board{min-height:350px}}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.tile{padding:8px;border-radius:11px}.phrase{font-size:11px}}
</style>
</head>
<body><div class="app"><header><div><div class="eyebrow">Wahlabend · Zwei Personen · Ein Bingo</div><h1>Politische Floskeln – live abhaken.</h1></div><div class="controls"><button id="reset">↺ Neue Runde</button><button id="fullscreen" class="primary">⛶ Vollbild</button></div></header><main class="layout"><section class="player left"><div class="player-top"><div class="player-name"><span class="dot"></span> Person 1</div><div class="score" id="score1">0 / 9</div></div><div class="board" id="board1"></div><div class="bottom"><div class="hint">Antippen = markiert · erneut tippen = zurück</div><div class="win" id="win1">BINGO!</div></div></section><section class="player right"><div class="player-top"><div class="player-name"><span class="dot"></span> Person 2</div><div class="score" id="score2">0 / 9</div></div><div class="board" id="board2"></div><div class="bottom"><div class="hint">Antippen = markiert · erneut tippen = zurück</div><div class="win" id="win2">BINGO!</div></div></section></main><footer>Wer zuerst eine vollständige Dreierreihe hat, gewinnt.</footer></div><div id="overlay" hidden><div></div></div>
<script>
const phrases=["Wir haben verstanden.","Das Wahlergebnis ist ein klarer Auftrag.","Wir werden jetzt sehr genau analysieren.","Die Menschen erwarten Lösungen.","Wir müssen wieder mehr zuhören.","Es geht nicht um Personen, sondern um Inhalte.","Wir nehmen das Ergebnis sehr ernst.","Das ist heute kein Abend für Parteitaktik.","Wir stehen vor großen Herausforderungen.","Wir werden das Vertrauen zurückgewinnen.","Jetzt heißt es: Ärmel hochkrempeln.","Die Tür für Gespräche ist offen.","Wir müssen Brücken bauen.","Das war ein intensiver Wahlkampf.","Wir respektieren die Entscheidung.","Es braucht einen neuen Stil.","Wir haben unsere Hausaufgaben gemacht.","Die nächsten Tage werden entscheidend.","Wir bleiben gesprächsbereit.","Das ist ein Weckruf."];
const state=[Array(9).fill(false),Array(9).fill(false)],stamps=[Array(9).fill(""),Array(9).fill("")];let cards=[[],[]];
function shuffledNine(){return [...phrases].sort(()=>Math.random()-.5).slice(0,9)}function now(){return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}function hasBingo(s){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(i=>s[i]))}
function render(p){const board=document.getElementById('board'+(p+1));board.innerHTML='';cards[p].forEach((phrase,i)=>{const b=document.createElement('button');b.className='tile'+(state[p][i]?' selected':'');b.setAttribute('aria-pressed',String(state[p][i]));b.innerHTML='<span class="mark">✓</span><span class="phrase"></span><span class="stamp"></span>';b.querySelector('.phrase').textContent=phrase;b.querySelector('.stamp').textContent=state[p][i]?'Gesagt · '+stamps[p][i]:'';b.onclick=()=>{state[p][i]=!state[p][i];stamps[p][i]=state[p][i]?now():'';render(p);updateScores()};board.appendChild(b)})}
function updateScores(){for(let p=0;p<2;p++){document.getElementById('score'+(p+1)).textContent=state[p].filter(Boolean).length+' / 9';document.getElementById('win'+(p+1)).classList.toggle('show',hasBingo(state[p]))}}
function resetGame(){for(let p=0;p<2;p++){state[p].fill(false);stamps[p].fill('');cards[p]=shuffledNine();render(p)}updateScores()}
document.getElementById('reset').onclick=()=>{if(confirm('Alle Markierungen löschen und neue Karten erstellen?'))resetGame()};document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('Vollbild wird von diesem Browser nicht unterstützt.')}};resetGame();
</script></body></html>
