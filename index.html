17:['Ankommen ist schon ein Abenteuer','Wir wohnen diese Woche genau zwischen Danzig und Sopot. Die kleinen Züge hier fahren fast wie eine U-Bahn – nur oberirdisch und ganz nah am Meer.','Gelb-blaue Züge zählen und das erste polnische Wort suchen.','Ist unser Urlaubszuhause jetzt in Polen?'],
18:['Warum kann man über das Meer laufen?','Das Molo ist ein sehr langer Steg. Damit können wir weit über dem Wasser spazieren, ohne ein Boot zu brauchen. Die Ostsee verbindet Polen mit vielen anderen Ländern.','Möwen zählen, Muscheln suchen, Spuren im Sand vergleichen.','Fährt das Molo auch weg?'],
19:['Die Stadt mit den bunten Häusern','Danzig war schon vor sehr langer Zeit eine wichtige Handelsstadt. Viele Häuser stehen auf schmalen Grundstücken und zeigen zur Straße ihre schönste Seite. Am Krantor wurden schwere Waren von Schiffen gehoben.','Tiere an Fassaden, Gold, Türme und Wasserspeier finden.','Welches Haus würdest du nehmen?'],
20:['Wie knabbert das Meer am Land?','Ein Kliff ist eine hohe Küste. Wind, Regen und Wellen tragen ganz langsam Erde und Sand weg. Darum sieht das Meer hier anders aus als am flachen Strand von Sopot.','Oben Bäume, unten Steine: unterschiedliche Küstenformen suchen.','Kann das Meer den ganzen Berg wegknabbern?'],
21:['Ein Park wie ein grünes Zimmer','Im Park Oliwski wurden Wege, Teiche und Pflanzen ganz bewusst angelegt. In der Kathedrale macht die riesige Orgel Musik, indem Luft durch viele Pfeifen strömt.','Teiche zählen und die größten Orgelpfeifen entdecken.','Warum hat die Orgel so viele Rohre?'],
22:['Eine Burg aus Millionen roten Steinen','Die Marienburg ist eine riesige Burg aus Backstein. Die Steine wurden aus Ton geformt und im Feuer hart gebrannt. Tore, Mauern und Brücken sollten die Menschen darin schützen.','Tore, Brücken, Ritterzeichen und die dicksten Mauern suchen.','Wo hätten die Ritter geschlafen?'],
23:['Was bedeutet Zusammenhalten?','Auf der Werft wurden große Schiffe gebaut. Viele Arbeiter haben gemeinsam gesagt: Wir wollen mitreden und fair behandelt werden. Solidarność heißt ungefähr: Wir halten zusammen.','Kräne suchen und überlegen, welches Schiffsteil wohl am schwersten ist.','Haben die Leute zusammen gewonnen?'],
24:['Die Reise rückwärts erzählen','Heute fahren wir wieder Richtung Berlin. Im Zug können wir überlegen: Was war das salzigste, höchste, bunteste und spannendste Ding unserer Woche?','Jede Person wählt ein Lieblingsbild der Reise.','Wann fahren wir wieder ans Meer?']};
