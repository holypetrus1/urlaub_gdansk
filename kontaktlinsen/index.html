<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Linsen"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="favicon.svg"><title>Kontaktlinsen</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#171717;background:#f5f5f7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f7}body{min-height:100dvh}main{height:100dvh;max-width:560px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}h1{font-size:23px;line-height:1;margin:3px 2px 5px;font-weight:750}.card{background:#fff;border-radius:18px;padding:13px 15px;box-shadow:0 1px 7px #0000000b}.hero{text-align:center;padding:15px}.eyebrow{font-size:10px;color:#777;font-weight:700;letter-spacing:.06em}.days{font-size:58px;line-height:.95;font-weight:800;margin:4px}.unit{font-size:12px;color:#777}.next{margin:10px auto 0;padding:9px 12px;border-radius:13px;background:#f0f0f3;max-width:330px}.next strong{font-size:17px}.countdown{font-size:12px;color:#666;margin-top:2px}.status{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:750}.ok{background:#e5f6eb;color:#176b37}.soon{background:#fff0cf;color:#8a5b00}.late{background:#ffe2df;color:#9f261e}button{border:0;border-radius:13px;padding:11px 13px;font-size:14px;font-weight:700;background:#171717;color:#fff;cursor:pointer}button.primary{width:100%;margin-top:10px}button.secondary{background:#ededf0;color:#171717}.row{display:flex;gap:7px}.row>*{flex:1}h2{font-size:15px;margin:0 0 7px}.history{display:flex;gap:5px;overflow:hidden}.historyItem{min-width:0;flex:1;text-align:center;padding:7px 3px;border-radius:10px;background:#f3f3f5}.historyItem b{display:block;font-size:11px}.historyItem span{display:block;font-size:9px;color:#777;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat{text-align:center;background:#f5f5f7;border-radius:10px;padding:7px 2px}.stat b{display:block;font-size:13px}.stat span{font-size:9px;color:#777}.footer{display:flex;gap:6px}.footer button{font-size:11px;padding:8px 9px;flex:1}.small{font-size:9px;color:#888;text-align:center;margin-top:4px}dialog{border:0;border-radius:20px;padding:20px;width:min(390px,calc(100% - 28px));box-shadow:0 20px 60px #0005;background:#fff;color:#171717}dialog::backdrop{background:#0005}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;font-size:16px;margin:6px 0 13px;background:#fff;color:#171717}.danger{color:#a52a22;font-size:12px;text-align:center;margin-top:9px}@media(max-height:700px){main{gap:5px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(5px + env(safe-area-inset-bottom))}.hero{padding:10px}.days{font-size:51px}.card{padding:10px 12px}.next{margin-top:6px;padding:7px}.primary{margin-top:7px!important}.historyItem{padding:5px 2px}.stat{padding:5px 2px}}@media(max-width:370px){h1{font-size:21px}.days{font-size:47px}.card{padding:9px 10px}.footer button{font-size:10px;padding:7px 5px}}</style></head><body><main><h1>Kontaktlinsen</h1><section class="card hero"><div class="eyebrow">SEIT DEM LETZTEN WECHSEL</div><div class="days" id="days">–</div><div class="unit">Tage</div><div class="next"><div class="eyebrow">NÄCHSTER WECHSEL · 42 TAGE</div><strong id="next">–</strong><div class="countdown" id="countdown"></div><div id="status"></div></div><button class="primary" id="addBtn">Wechsel eintragen</button></section><section class="card"><h2>Verlauf</h2><div class="history" id="history"></div></section><section class="card"><div class="stats"><div class="stat"><b id="count">0</b><span>Wechsel</span></div><div class="stat"><b id="avg">–</b><span>Ø Intervall</span></div><div class="stat"><b id="last">–</b><span>Letztes</span></div></div></section><section class="card"><div class="footer"><button class="secondary" id="export">Backup</button><button class="secondary" id="import">Import</button><button class="secondary" id="reset">Löschen</button></div><input id="file" type="file" accept="application/json,.json" hidden><div class="small">Daten werden nur lokal auf diesem Gerät gespeichert.</div></section></main><dialog id="dlg"><h2 id="dlgTitle">Wechseltag</h2><div class="eyebrow">AN WELCHEM TAG HAST DU GEWECHSELT?</div><input id="date" type="date"><div class="row"><button class="secondary" id="cancel">Abbrechen</button><button id="save">Speichern</button></div><div id="deleteEdit" class="danger" style="display:none">Eintrag löschen</div></dialog><script>const KEY='kontaktlinsen-v3',DAYS=42;let dates=load(),editing=null;const $=id=>document.getElementById(id);function load(){try{return [...new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))].filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort()}catch{return[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(dates));render()}function ds(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function dt(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function fmt(s,short=false){return dt(s).toLocaleDateString('de-DE',short?{day:'2-digit',month:'2-digit'}:{day:'2-digit',month:'2-digit',year:'numeric'})}function diff(a,b){return Math.round((dt(b)-dt(a))/86400000)}function add(s,n){let d=dt(s);d.setDate(d.getDate()+n);return ds(d)}function openEditor(d=null){editing=d; $('date').value=d||ds();$('date').max=ds();$('dlgTitle').textContent=d?'Wechseltag ändern':'Wechseltag eintragen';$('deleteEdit').style.display=d?'block':'none';$('dlg').showModal()}$('addBtn').onclick=()=>openEditor();$('cancel').onclick=()=>$('dlg').close();$('save').onclick=()=>{if(!$('date').value)return;if(editing)dates=dates.filter(x=>x!==editing);dates=[...new Set([...dates,$('date').value])].sort();persist();$('dlg').close()};$('deleteEdit').onclick=()=>{if(editing&&confirm('Diesen Eintrag löschen?')){dates=dates.filter(x=>x!==editing);persist();$('dlg').close()}};window.openEditor=openEditor;function render(){if(!dates.length){$('days').textContent='–';$('next').textContent='Noch kein Wechsel';$('countdown').textContent='';$('status').innerHTML='';$('history').innerHTML='<div style="width:100%;text-align:center;color:#777;font-size:11px;padding:5px">Noch kein Eintrag</div>';$('count').textContent='0';$('avg').textContent=$('last').textContent='–';return}let l=dates.at(-1),today=ds(),age=diff(l,today),n=add(l,DAYS),until=diff(today,n);$('days').textContent=age;$('next').textContent=fmt(n);$('countdown').textContent=until>0?'noch '+until+' Tage':until===0?'heute fällig':Math.abs(until)+' Tage über dem Solltermin';let cls=until<0?'late':until<=7?'soon':'ok',txt=until<0?'überfällig':until<=7?'bald':'im Soll';$('status').innerHTML='<span class="status '+cls+'">'+txt+'</span>';let ints=[];for(let i=1;i<dates.length;i++)ints.push(diff(dates[i-1],dates[i]));$('count').textContent=dates.length;$('avg').textContent=ints.length?(ints.reduce((a,b)=>a+b,0)/ints.length).toFixed(1)+' d':'–';$('last').textContent=ints.length?ints.at(-1)+' d':'–';$('history').innerHTML=dates.slice().reverse().slice(0,5).map((d,i)=>{let older=dates[dates.length-i-2],inter=older?diff(older,d)+' d':'—';return '<button class="historyItem secondary" onclick="openEditor(\''+d+'\')"><b>'+fmt(d,true)+'</b><span>'+inter+'</span></button>'}).join('')}$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'kontaktlinsen',version:3,dates},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kontaktlinsen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.dates))throw 0;dates=[...new Set(x.dates)].filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();persist();alert('Backup importiert.')}catch{alert('Backup konnte nicht gelesen werden.')}};r.readAsText(f)};$('reset').onclick=()=>{if(confirm('Wirklich alle Wechsel-Daten löschen?')){dates=[];persist()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
